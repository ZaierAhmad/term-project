name: Staging CI/CD

on:
  push:
    branches:
      - release/*

jobs:
  build_and_deploy_staging:
    runs-on: ubuntu-latest
    environment: Staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build with Parcel for Staging
      run: npm run build:staging # Use specific build script for staging

    - name: Deploy to GitHub Pages (Staging)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        publish_branch: gh-pages # Or a specific staging branch if preferred
